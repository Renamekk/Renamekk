<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">GitHub channel</title>
  <desc id="desc">Animated cosmic portal linking to Renamekk on GitHub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030108"/><stop offset=".55" stop-color="#0d031e"/><stop offset="1" stop-color="#1b0635"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#f5d0fe"/><stop offset=".32" stop-color="#a855f7"/><stop offset=".75" stop-color="#4c1d95"/><stop offset="1" stop-color="#0a0114"/></radialGradient>
    <linearGradient id="line"><stop stop-color="#8b5cf6" stop-opacity="0"/><stop offset=".5" stop-color="#e879f9"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#c4b5fd" stroke-width=".4" opacity=".08"/></pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect x="5" y="5" width="1190" height="200" rx="30"/></clipPath>
  </defs>
  <style>text{font-family:"Segoe UI",Arial,sans-serif}.mono{font-family:"Cascadia Code",Consolas,monospace}@media(prefers-reduced-motion:reduce){animate,animateTransform{display:none}}</style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="210" fill="url(#bg)"/><rect width="1200" height="210" fill="url(#grid)"/>
    <ellipse cx="190" cy="105" rx="215" ry="155" fill="#7c3aed" opacity=".1"><animate attributeName="opacity" values=".07;.2;.07" dur="5s" repeatCount="indefinite"/></ellipse>
    <g transform="translate(146 105)" filter="url(#glow)">
      <circle r="57" fill="#7c3aed" opacity=".13"><animate attributeName="r" values="52;68;52" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;.3;.1" dur="4s" repeatCount="indefinite"/></circle>
      <circle r="46" fill="url(#orb)"/>
      <circle r="58" fill="none" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="5 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/></circle>
      <circle r="68" fill="none" stroke="#e879f9" stroke-width=".8" stroke-dasharray="2 13" opacity=".6"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/></circle>
      <g><text y="11" fill="#fff" font-size="29" font-weight="800" letter-spacing="-2" text-anchor="middle">&lt;/&gt;</text><animateTransform attributeName="transform" type="translate" values="0 3;0 -4;0 3" dur="3.8s" repeatCount="indefinite"/></g>
    </g>
    <path d="M230 105H1060" stroke="url(#line)" stroke-width="1.2" stroke-dasharray="8 12"><animate attributeName="stroke-dashoffset" from="0" to="-120" dur="7s" repeatCount="indefinite"/></path>
    <circle r="3" fill="#67e8f9" filter="url(#glow)"><animate attributeName="cx" values="230;1060" dur="4s" repeatCount="indefinite"/><animate attributeName="cy" values="105;105" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/></circle>
    <text x="282" y="62" class="mono" fill="#a78bfa" font-size="11" letter-spacing="2.5">CHANNEL 01 // OPEN SOURCE</text>
    <text x="280" y="118" fill="#f5f3ff" font-size="42" font-weight="800" letter-spacing="7">GITHUB</text>
    <text x="282" y="151" class="mono" fill="#c4b5fd" font-size="14" letter-spacing="1.8">github.com/Renamekk</text>
    <g transform="translate(918 70)"><rect width="202" height="70" rx="18" fill="#16072c" stroke="#8b5cf6" stroke-opacity=".65"/><circle cx="24" cy="23" r="4" fill="#c084fc" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/></circle><text x="41" y="28" class="mono" fill="#ddd6fe" font-size="10" letter-spacing="1.4">PORTAL ONLINE</text><text x="24" y="52" class="mono" fill="#e879f9" font-size="9" letter-spacing="1.2">ENTER ORBIT →</text></g>
    <rect x="-180" y="0" width="120" height="210" fill="url(#line)" opacity=".06" transform="skewX(-20)"><animate attributeName="x" values="-180;1380" dur="6s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="5.5" y="5.5" width="1189" height="199" rx="29.5" fill="none" stroke="#a78bfa" stroke-opacity=".42"/><rect x="12" y="12" width="1176" height="186" rx="24" fill="none" stroke="#c084fc" stroke-opacity=".12" stroke-dasharray="10 15"><animate attributeName="stroke-dashoffset" from="0" to="-50" dur="5s" repeatCount="indefinite"/></rect>
</svg>
