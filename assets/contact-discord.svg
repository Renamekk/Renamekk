<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Discord channel</title>
  <desc id="desc">Animated cosmic card showing the Discord handle Isagiko0.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030108"/><stop offset=".52" stop-color="#0c0724"/><stop offset="1" stop-color="#21083b"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#e0e7ff"/><stop offset=".3" stop-color="#818cf8"/><stop offset=".7" stop-color="#7c3aed"/><stop offset="1" stop-color="#090112"/></radialGradient>
    <linearGradient id="line"><stop stop-color="#818cf8" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#e879f9" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#a5b4fc" stroke-width=".4" opacity=".065"/></pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect x="5" y="5" width="1190" height="200" rx="30"/></clipPath>
  </defs>
  <style>text{font-family:"Segoe UI",Arial,sans-serif}.mono{font-family:"Cascadia Code",Consolas,monospace}@media(prefers-reduced-motion:reduce){animate,animateTransform{display:none}}</style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="210" fill="url(#bg)"/><rect width="1200" height="210" fill="url(#grid)"/>
    <ellipse cx="600" cy="105" rx="430" ry="190" fill="#6366f1" opacity=".06"><animate attributeName="opacity" values=".04;.13;.04" dur="6s" repeatCount="indefinite"/></ellipse>
    <g transform="translate(146 105)" filter="url(#glow)">
      <circle r="57" fill="#818cf8" opacity=".11"><animate attributeName="r" values="52;68;52" dur="4.7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".08;.25;.08" dur="4.7s" repeatCount="indefinite"/></circle>
      <circle r="46" fill="url(#orb)"/>
      <circle r="58" fill="none" stroke="#a5b4fc" stroke-width="1" stroke-dasharray="5 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/></circle>
      <circle r="68" fill="none" stroke="#e879f9" stroke-width=".8" stroke-dasharray="2 13" opacity=".6"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="17s" repeatCount="indefinite"/></circle>
      <g><path d="M-27-17c18-8 36-8 54 0 7 11 10 23 9 36-9 8-17 12-24 14l-5-7c8-2 13-5 17-8-19 9-37 9-54 0 5 4 10 7 17 8l-5 7c-8-2-16-6-24-14-1-13 2-25 9-36Z" fill="#fff"/><circle cx="-12" cy="4" r="5" fill="#818cf8"/><circle cx="12" cy="4" r="5" fill="#818cf8"/><animateTransform attributeName="transform" type="translate" values="0 3;0 -4;0 3" dur="4.2s" repeatCount="indefinite"/></g>
    </g>
    <path d="M230 105H1060" stroke="url(#line)" stroke-width="1.2" stroke-dasharray="8 12"><animate attributeName="stroke-dashoffset" from="0" to="-120" dur="7.4s" repeatCount="indefinite"/></path>
    <circle r="3" fill="#a5b4fc" filter="url(#glow)"><animate attributeName="cx" values="230;1060" dur="4.5s" begin="-1s" repeatCount="indefinite"/><animate attributeName="cy" values="105;105" dur="4.5s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="4.5s" begin="-1s" repeatCount="indefinite"/></circle>
    <text x="282" y="62" class="mono" fill="#a5b4fc" font-size="11" letter-spacing="2.5">CHANNEL 03 // DISCORD RELAY</text>
    <text x="280" y="118" fill="#f5f3ff" font-size="42" font-weight="800" letter-spacing="7">DISCORD</text>
    <text x="282" y="151" class="mono" fill="#c4b5fd" font-size="14" letter-spacing="1.8">@Isagiko0</text>
    <g transform="translate(918 70)"><rect width="202" height="70" rx="18" fill="#100b2b" stroke="#818cf8" stroke-opacity=".62"/><circle cx="24" cy="23" r="4" fill="#a5b4fc" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/></circle><text x="41" y="28" class="mono" fill="#e0e7ff" font-size="10" letter-spacing="1.4">RELAY ACTIVE</text><text x="24" y="52" class="mono" fill="#e879f9" font-size="9" letter-spacing="1.2">HANDLE // PUBLIC</text></g>
    <rect x="-180" y="0" width="120" height="210" fill="url(#line)" opacity=".06" transform="skewX(-20)"><animate attributeName="x" values="-180;1380" dur="6.8s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="5.5" y="5.5" width="1189" height="199" rx="29.5" fill="none" stroke="#818cf8" stroke-opacity=".35"/><rect x="12" y="12" width="1176" height="186" rx="24" fill="none" stroke="#e879f9" stroke-opacity=".12" stroke-dasharray="10 15"><animate attributeName="stroke-dashoffset" from="0" to="-50" dur="5s" repeatCount="indefinite"/></rect>
</svg>
