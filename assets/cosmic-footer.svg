<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="footerTitle footerDesc">
  <title id="footerTitle">End of transmission</title>
  <desc id="footerDesc">An animated purple planetary horizon under a field of twinkling stars.</desc>

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07010f" />
      <stop offset=".42" stop-color="#0d031c" />
      <stop offset="1" stop-color="#18052f" />
    </linearGradient>
    <radialGradient id="planet" cx=".5" cy=".05" r=".85">
      <stop offset="0" stop-color="#581c87" />
      <stop offset=".48" stop-color="#24063d" />
      <stop offset="1" stop-color="#07010d" />
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0" />
      <stop offset=".28" stop-color="#8b5cf6" stop-opacity=".75" />
      <stop offset=".5" stop-color="#f0abfc" />
      <stop offset=".72" stop-color="#8b5cf6" stop-opacity=".75" />
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-200%" y="-300%" width="500%" height="700%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frame">
      <path d="M24 0h1152a24 24 0 0 1 24 24v166H0V24A24 24 0 0 1 24 0Z" />
    </clipPath>
  </defs>

  <style>
    text {
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }

    @media (prefers-reduced-motion: reduce) {
      animate,
      animateTransform {
        display: none;
      }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="190" fill="url(#space)" />

    <g fill="#f5f3ff" filter="url(#glow)">
      <circle cx="96" cy="42" r="1.2">
        <animate attributeName="opacity" values=".15;1;.15" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="204" cy="78" r=".9">
        <animate attributeName="opacity" values=".25;.8;.25" dur="6.2s" begin="-2s" repeatCount="indefinite" />
      </circle>
      <circle cx="331" cy="33" r="1.5">
        <animate attributeName="opacity" values=".1;1;.1" dur="3.7s" begin="-1s" repeatCount="indefinite" />
      </circle>
      <circle cx="452" cy="69" r=".8">
        <animate attributeName="opacity" values=".2;.9;.2" dur="5.6s" begin="-3s" repeatCount="indefinite" />
      </circle>
      <circle cx="748" cy="47" r="1">
        <animate attributeName="opacity" values=".2;1;.2" dur="4.5s" begin="-1.7s" repeatCount="indefinite" />
      </circle>
      <circle cx="876" cy="73" r="1.4">
        <animate attributeName="opacity" values=".1;.95;.1" dur="6.5s" begin="-4s" repeatCount="indefinite" />
      </circle>
      <circle cx="1002" cy="30" r=".9">
        <animate attributeName="opacity" values=".2;.8;.2" dur="4.1s" begin="-.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="1114" cy="82" r="1.5">
        <animate attributeName="opacity" values=".15;1;.15" dur="5.1s" begin="-2.6s" repeatCount="indefinite" />
      </circle>
    </g>

    <text x="600" y="69" fill="#c4b5fd" font-size="12" letter-spacing="4" text-anchor="middle">END OF TRANSMISSION // SIGNAL REMAINS
      <animate attributeName="opacity" values=".45;1;.45" dur="4s" repeatCount="indefinite" />
    </text>

    <ellipse cx="600" cy="246" rx="515" ry="148" fill="url(#planet)" />
    <path d="M82 149c158-70 878-70 1036 0" fill="none" stroke="#8b5cf6" stroke-width="18" opacity=".12" filter="url(#glow)" />
    <path d="M82 149c158-70 878-70 1036 0" fill="none" stroke="url(#horizon)" stroke-width="2.2" filter="url(#glow)">
      <animate attributeName="opacity" values=".55;1;.55" dur="5s" repeatCount="indefinite" />
    </path>

    <g fill="#e9d5ff" opacity=".46">
      <circle cx="463" cy="139" r="1" />
      <circle cx="511" cy="130" r=".8" />
      <circle cx="686" cy="130" r=".9" />
      <circle cx="738" cy="139" r="1" />
    </g>
  </g>

  <path d="M24 .5h1152a23.5 23.5 0 0 1 23.5 23.5" fill="none" stroke="#a78bfa" stroke-opacity=".25" />
  <path d="M.5 24A23.5 23.5 0 0 1 24 .5" fill="none" stroke="#a78bfa" stroke-opacity=".25" />
</svg>
