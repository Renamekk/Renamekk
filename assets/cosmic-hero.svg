<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">Renamekk — deep-space developer</title>
  <desc id="description">An animated violet space scene with a ringed planet, orbiting satellites, stars, and rotating mission statements.</desc>

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030108" />
      <stop offset=".42" stop-color="#0b031a" />
      <stop offset="1" stop-color="#17052f" />
    </linearGradient>

    <radialGradient id="nebulaA" cx=".28" cy=".42" r=".62">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".34" />
      <stop offset=".38" stop-color="#581c87" stop-opacity=".16" />
      <stop offset="1" stop-color="#090214" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaB" cx=".78" cy=".34" r=".5">
      <stop offset="0" stop-color="#d946ef" stop-opacity=".22" />
      <stop offset=".44" stop-color="#6d28d9" stop-opacity=".11" />
      <stop offset="1" stop-color="#090214" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="planet" cx=".32" cy=".25" r=".82">
      <stop offset="0" stop-color="#f0abfc" />
      <stop offset=".16" stop-color="#c084fc" />
      <stop offset=".47" stop-color="#7c3aed" />
      <stop offset=".76" stop-color="#3b0764" />
      <stop offset="1" stop-color="#12051f" />
    </radialGradient>

    <linearGradient id="planetShade" x1=".1" y1=".1" x2=".9" y2=".9">
      <stop offset=".28" stop-color="#fff" stop-opacity="0" />
      <stop offset=".76" stop-color="#06000d" stop-opacity=".5" />
      <stop offset="1" stop-color="#020005" stop-opacity=".9" />
    </linearGradient>

    <linearGradient id="ring" x1="0" y1=".5" x2="1" y2=".5">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0" />
      <stop offset=".24" stop-color="#c4b5fd" stop-opacity=".55" />
      <stop offset=".5" stop-color="#f5d0fe" stop-opacity=".92" />
      <stop offset=".76" stop-color="#a78bfa" stop-opacity=".48" />
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".35" stop-color="#ddd6fe" />
      <stop offset=".72" stop-color="#c084fc" />
      <stop offset="1" stop-color="#e879f9" />
    </linearGradient>

    <linearGradient id="signalLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0" />
      <stop offset=".2" stop-color="#8b5cf6" stop-opacity=".8" />
      <stop offset=".5" stop-color="#e879f9" />
      <stop offset=".8" stop-color="#8b5cf6" stop-opacity=".8" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#c4b5fd" stroke-width=".45" opacity=".1" />
    </pattern>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="starGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="titleGlow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="0.58 0 0 0 0.30  0 0.30 0 0 0.10  0 0 0.95 0 0.85  0 0 0 0.75 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="6" y="6" width="1188" height="448" rx="34" />
    </clipPath>

    <path id="wideOrbit" d="M750 218a185 116 0 1 0 370 0 185 116 0 1 0-370 0" />
    <path id="smallOrbit" d="M814 218a121 74 0 1 0 242 0 121 74 0 1 0-242 0" />
  </defs>

  <style>
    text {
      font-family: "Segoe UI", "Trebuchet MS", Arial, sans-serif;
    }

    .mono {
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }

    @media (prefers-reduced-motion: reduce) {
      animate,
      animateMotion,
      animateTransform {
        display: none;
      }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="url(#space)" />
    <rect width="1200" height="460" fill="url(#grid)" />

    <ellipse cx="322" cy="218" rx="490" ry="330" fill="url(#nebulaA)">
      <animate attributeName="opacity" values=".58;.96;.58" dur="11s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="935" cy="170" rx="420" ry="300" fill="url(#nebulaB)">
      <animate attributeName="opacity" values=".82;.46;.82" dur="14s" repeatCount="indefinite" />
    </ellipse>

    <g fill="#f5f3ff" filter="url(#starGlow)">
      <circle cx="62" cy="65" r="1.5">
        <animate attributeName="opacity" values=".15;1;.15" dur="3.7s" repeatCount="indefinite" />
      </circle>
      <circle cx="136" cy="113" r="1">
        <animate attributeName="opacity" values=".2;.85;.2" dur="5.8s" begin="-2s" repeatCount="indefinite" />
      </circle>
      <circle cx="224" cy="49" r="1.9">
        <animate attributeName="opacity" values=".18;1;.18" dur="4.6s" begin="-1s" repeatCount="indefinite" />
      </circle>
      <circle cx="341" cy="91" r="1.1">
        <animate attributeName="opacity" values=".3;.95;.3" dur="6.4s" begin="-3s" repeatCount="indefinite" />
      </circle>
      <circle cx="448" cy="43" r=".9">
        <animate attributeName="opacity" values=".15;.8;.15" dur="4.1s" begin="-1.4s" repeatCount="indefinite" />
      </circle>
      <circle cx="536" cy="119" r="1.4">
        <animate attributeName="opacity" values=".2;1;.2" dur="5.2s" begin="-2.7s" repeatCount="indefinite" />
      </circle>
      <circle cx="648" cy="61" r="1">
        <animate attributeName="opacity" values=".15;.9;.15" dur="3.9s" begin="-.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="742" cy="126" r="1.7">
        <animate attributeName="opacity" values=".2;1;.2" dur="6.8s" begin="-4s" repeatCount="indefinite" />
      </circle>
      <circle cx="837" cy="55" r="1.2">
        <animate attributeName="opacity" values=".25;.95;.25" dur="4.4s" begin="-1.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="966" cy="79" r=".9">
        <animate attributeName="opacity" values=".15;.9;.15" dur="5.7s" begin="-2.3s" repeatCount="indefinite" />
      </circle>
      <circle cx="1088" cy="48" r="1.8">
        <animate attributeName="opacity" values=".2;1;.2" dur="3.6s" begin="-1.7s" repeatCount="indefinite" />
      </circle>
      <circle cx="1141" cy="143" r="1.1">
        <animate attributeName="opacity" values=".15;.85;.15" dur="6.2s" begin="-3.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="91" cy="286" r="1">
        <animate attributeName="opacity" values=".2;.9;.2" dur="5.5s" begin="-2s" repeatCount="indefinite" />
      </circle>
      <circle cx="190" cy="363" r="1.5">
        <animate attributeName="opacity" values=".15;1;.15" dur="4.2s" begin="-.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="306" cy="317" r=".8">
        <animate attributeName="opacity" values=".2;.8;.2" dur="6.1s" begin="-4.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="403" cy="399" r="1.6">
        <animate attributeName="opacity" values=".1;1;.1" dur="3.8s" begin="-1.1s" repeatCount="indefinite" />
      </circle>
      <circle cx="528" cy="347" r="1">
        <animate attributeName="opacity" values=".2;.95;.2" dur="5.9s" begin="-3.1s" repeatCount="indefinite" />
      </circle>
      <circle cx="632" cy="411" r="1.3">
        <animate attributeName="opacity" values=".15;.9;.15" dur="4.7s" begin="-2.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="755" cy="354" r=".8">
        <animate attributeName="opacity" values=".2;.8;.2" dur="6.6s" begin="-.9s" repeatCount="indefinite" />
      </circle>
      <circle cx="873" cy="406" r="1.5">
        <animate attributeName="opacity" values=".15;1;.15" dur="4s" begin="-2.9s" repeatCount="indefinite" />
      </circle>
      <circle cx="1018" cy="365" r="1">
        <animate attributeName="opacity" values=".2;.9;.2" dur="5.4s" begin="-3.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="1127" cy="390" r="1.8">
        <animate attributeName="opacity" values=".12;1;.12" dur="3.5s" begin="-1.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <g opacity="0">
      <path d="M0 0L-96-34" stroke="#ddd6fe" stroke-width="2" stroke-linecap="round" />
      <circle r="3" fill="#fff" filter="url(#starGlow)" />
      <animateTransform attributeName="transform" type="translate" from="140 70" to="980 368" dur="2.4s" begin="1.2s;11.2s" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.16;.68;1" dur="2.4s" begin="1.2s;11.2s" />
    </g>

    <g opacity="0">
      <path d="M0 0L-74-26" stroke="#e879f9" stroke-width="1.5" stroke-linecap="round" />
      <circle r="2.5" fill="#f5d0fe" filter="url(#starGlow)" />
      <animateTransform attributeName="transform" type="translate" from="650 34" to="1160 214" dur="1.8s" begin="6.8s;16.8s" />
      <animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.2;.65;1" dur="1.8s" begin="6.8s;16.8s" />
    </g>

    <g opacity=".48">
      <use href="#wideOrbit" fill="none" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="7 12">
        <animate attributeName="stroke-dashoffset" from="0" to="-190" dur="18s" repeatCount="indefinite" />
      </use>
      <use href="#smallOrbit" fill="none" stroke="#e879f9" stroke-width=".8" stroke-dasharray="3 11">
        <animate attributeName="stroke-dashoffset" from="0" to="140" dur="13s" repeatCount="indefinite" />
      </use>
    </g>

    <g>
      <ellipse cx="935" cy="223" rx="185" ry="48" fill="none" stroke="url(#ring)" stroke-width="12" opacity=".72" transform="rotate(-10 935 223)" />
      <ellipse cx="935" cy="223" rx="185" ry="48" fill="none" stroke="#e9d5ff" stroke-width="1.2" opacity=".5" transform="rotate(-10 935 223)" />

      <circle cx="935" cy="218" r="102" fill="#7c3aed" opacity=".22" filter="url(#softGlow)">
        <animate attributeName="r" values="98;111;98" dur="6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values=".16;.3;.16" dur="6s" repeatCount="indefinite" />
      </circle>

      <circle cx="935" cy="218" r="94" fill="url(#planet)" />
      <path d="M858 190c31 15 73 17 111 5 22-7 39-15 54-25" fill="none" stroke="#f5d0fe" stroke-width="9" opacity=".18" stroke-linecap="round" />
      <path d="M859 235c40-7 88-1 133 19" fill="none" stroke="#312e81" stroke-width="13" opacity=".25" stroke-linecap="round" />
      <circle cx="935" cy="218" r="94" fill="url(#planetShade)" />

      <path d="M750 223c33 39 110 59 185 48 70-10 134-47 184-87" fill="none" stroke="url(#ring)" stroke-width="12" opacity=".8" />
      <path d="M750 223c33 39 110 59 185 48 70-10 134-47 184-87" fill="none" stroke="#fff" stroke-width="1" opacity=".35" />
    </g>

    <g>
      <circle r="6" fill="#67e8f9" filter="url(#starGlow)" />
      <circle r="14" fill="none" stroke="#67e8f9" stroke-width="1" opacity=".55">
        <animate attributeName="r" values="7;20;7" dur="2.6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values=".7;0;.7" dur="2.6s" repeatCount="indefinite" />
      </circle>
      <animateMotion dur="16s" repeatCount="indefinite" rotate="auto">
        <mpath href="#wideOrbit" />
      </animateMotion>
    </g>

    <g>
      <rect x="-5" y="-5" width="10" height="10" rx="2" fill="#f0abfc" transform="rotate(45)" filter="url(#starGlow)" />
      <animateMotion dur="10s" begin="-4s" repeatCount="indefinite" rotate="auto-reverse">
        <mpath href="#smallOrbit" />
      </animateMotion>
    </g>

    <g transform="translate(72 62)">
      <rect width="218" height="34" rx="17" fill="#16072c" stroke="#8b5cf6" stroke-opacity=".52" />
      <circle cx="18" cy="17" r="4" fill="#c084fc" filter="url(#starGlow)">
        <animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="22" class="mono" fill="#ddd6fe" font-size="11" letter-spacing="1.7">TRANSMISSION // ONLINE</text>
    </g>

    <text x="72" y="141" class="mono" fill="#a78bfa" font-size="14" letter-spacing="4">DEVELOPER FROM THE DEEP SPACE</text>

    <text x="66" y="244" fill="url(#titleGradient)" font-size="88" font-weight="800" letter-spacing="9" filter="url(#titleGlow)">RENAMEKK</text>

    <rect x="73" y="270" width="560" height="2" rx="1" fill="url(#signalLine)">
      <animate attributeName="width" values="170;560;170" dur="7s" repeatCount="indefinite" />
    </rect>

    <g class="mono" fill="#ddd6fe" font-size="17" letter-spacing="2.4">
      <text x="73" y="316" opacity="0">PRIVACY-FIRST SYSTEMS
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.27;.32;1" dur="12s" repeatCount="indefinite" />
      </text>
      <text x="73" y="316" opacity="0">OFFLINE-FIRST EXPERIENCES
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.32;.37;.59;.64;1" dur="12s" repeatCount="indefinite" />
      </text>
      <text x="73" y="316" opacity="0">AI · INTERFACES · AUTOMATION
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.64;.69;.92;1" dur="12s" repeatCount="indefinite" />
      </text>
    </g>

    <g class="mono" fill="#8b7aad" font-size="10" letter-spacing="1.6">
      <text x="73" y="400">ORBIT 47.31° N</text>
      <text x="256" y="400">SECTOR // OPEN SOURCE</text>
      <text x="1128" y="400" text-anchor="end">SIGNAL 0X7C3AED</text>
    </g>

    <path d="M73 417H1127" stroke="url(#signalLine)" stroke-width=".7" opacity=".55" />
  </g>

  <rect x="6.5" y="6.5" width="1187" height="447" rx="33.5" fill="none" stroke="#a78bfa" stroke-opacity=".42" />
  <rect x="13.5" y="13.5" width="1173" height="433" rx="27" fill="none" stroke="#c084fc" stroke-opacity=".12" stroke-dasharray="11 15">
    <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="5s" repeatCount="indefinite" />
  </rect>
</svg>
