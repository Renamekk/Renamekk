<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Telegram channel</title>
  <desc id="desc">Animated cosmic portal linking to Renamekk on Telegram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030108"/><stop offset=".52" stop-color="#071225"/><stop offset="1" stop-color="#16072f"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#cffafe"/><stop offset=".3" stop-color="#67e8f9"/><stop offset=".7" stop-color="#7c3aed"/><stop offset="1" stop-color="#090112"/></radialGradient>
    <linearGradient id="line"><stop stop-color="#67e8f9" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#67e8f9" stroke-width=".4" opacity=".065"/></pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect x="5" y="5" width="1190" height="200" rx="30"/></clipPath>
  </defs>
  <style>text{font-family:"Segoe UI",Arial,sans-serif}.mono{font-family:"Cascadia Code",Consolas,monospace}@media(prefers-reduced-motion:reduce){animate,animateTransform{display:none}}</style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="210" fill="url(#bg)"/><rect width="1200" height="210" fill="url(#grid)"/>
    <ellipse cx="1010" cy="105" rx="230" ry="160" fill="#0891b2" opacity=".08"><animate attributeName="opacity" values=".05;.16;.05" dur="5.5s" repeatCount="indefinite"/></ellipse>
    <g transform="translate(146 105)" filter="url(#glow)">
      <circle r="57" fill="#22d3ee" opacity=".11"><animate attributeName="r" values="52;68;52" dur="4.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".08;.26;.08" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle r="46" fill="url(#orb)"/>
      <circle r="58" fill="none" stroke="#67e8f9" stroke-width="1" stroke-dasharray="5 9"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/></circle>
      <circle r="68" fill="none" stroke="#c084fc" stroke-width=".8" stroke-dasharray="2 13" opacity=".6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/></circle>
      <g><path d="M-28-4 31-27 18 29 2 15-8 25-10 8Z" fill="#fff"/><path d="m-9 8 27-20L2 15" fill="none" stroke="#67e8f9" stroke-width="2"/><animateTransform attributeName="transform" type="translate" values="0 3;0 -4;0 3" dur="4s" repeatCount="indefinite"/></g>
    </g>
    <path d="M230 105H1060" stroke="url(#line)" stroke-width="1.2" stroke-dasharray="8 12"><animate attributeName="stroke-dashoffset" from="0" to="120" dur="7s" repeatCount="indefinite"/></path>
    <circle r="3" fill="#e879f9" filter="url(#glow)"><animate attributeName="cx" values="230;1060" dur="4.3s" begin="-2s" repeatCount="indefinite"/><animate attributeName="cy" values="105;105" dur="4.3s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="4.3s" begin="-2s" repeatCount="indefinite"/></circle>
    <text x="282" y="62" class="mono" fill="#67e8f9" font-size="11" letter-spacing="2.5">CHANNEL 02 // DIRECT COMMS</text>
    <text x="280" y="118" fill="#f5f3ff" font-size="42" font-weight="800" letter-spacing="7">TELEGRAM</text>
    <text x="282" y="151" class="mono" fill="#c4b5fd" font-size="14" letter-spacing="1.8">t.me/ne7ay</text>
    <g transform="translate(918 70)"><rect width="202" height="70" rx="18" fill="#07172a" stroke="#22d3ee" stroke-opacity=".62"/><circle cx="24" cy="23" r="4" fill="#67e8f9" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/></circle><text x="41" y="28" class="mono" fill="#cffafe" font-size="10" letter-spacing="1.4">CHANNEL READY</text><text x="24" y="52" class="mono" fill="#c084fc" font-size="9" letter-spacing="1.2">SEND SIGNAL →</text></g>
    <rect x="-180" y="0" width="120" height="210" fill="url(#line)" opacity=".06" transform="skewX(-20)"><animate attributeName="x" values="-180;1380" dur="6.4s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="5.5" y="5.5" width="1189" height="199" rx="29.5" fill="none" stroke="#67e8f9" stroke-opacity=".35"/><rect x="12" y="12" width="1176" height="186" rx="24" fill="none" stroke="#c084fc" stroke-opacity=".12" stroke-dasharray="10 15"><animate attributeName="stroke-dashoffset" from="0" to="50" dur="5s" repeatCount="indefinite"/></rect>
</svg>
